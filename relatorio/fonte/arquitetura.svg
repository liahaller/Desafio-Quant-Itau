<svg viewBox="0 0 1120 110" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, sans-serif">
  <defs>
    <marker id="seta2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#6B8299"/>
    </marker>
  </defs>

  <!-- fonte comum: o mesmo contrato lido de dois jeitos -->
  <rect x="2" y="16" width="122" height="76" rx="5" fill="#101F2E" stroke="#24384B"/>
  <text x="16" y="40" fill="#F5A623" font-size="10" font-weight="700" letter-spacing="1.3">MERCADO DE</text>
  <text x="16" y="54" fill="#F5A623" font-size="10" font-weight="700" letter-spacing="1.3">PREVISÃO</text>
  <text x="16" y="74" fill="#9BAEC0" font-size="10.4">a mesma fonte,</text>
  <text x="16" y="87" fill="#9BAEC0" font-size="10.4">duas leituras</text>

  <path d="M124,44 L154,32" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>
  <path d="M124,66 L154,80" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>

  <!-- ===== camada estrutural ===== -->
  <rect x="160" y="2" width="230" height="48" rx="5" fill="#101F2E" stroke="#C9820C"/>
  <text x="174" y="19" fill="#F5A623" font-size="10.4" font-weight="700" letter-spacing="1.4">CAMADA ESTRUTURAL</text>
  <text x="174" y="34" fill="#E8EDF2" font-size="11.1" font-weight="600">o nível da distribuição vira view</text>
  <text x="174" y="46" fill="#9BAEC0" font-size="10.4">P, Q e Ω de cada view ativa do dia</text>

  <path d="M390,26 L414,26" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>

  <rect x="420" y="2" width="230" height="48" rx="5" fill="#101F2E" stroke="#C9820C"/>
  <text x="434" y="19" fill="#F5A623" font-size="10.4" font-weight="700" letter-spacing="1.4">BLACK-LITTERMAN</text>
  <text x="434" y="34" fill="#9BAEC0" font-size="10.4">parte do equilíbrio e se afasta dele</text>
  <text x="434" y="46" fill="#E8EDF2" font-size="11.1" font-weight="600">→ desvio = w − w_mkt</text>

  <!-- ===== camada tática ===== -->
  <rect x="160" y="60" width="230" height="48" rx="5" fill="#101F2E" stroke="#3D8FC4"/>
  <text x="174" y="77" fill="#3D8FC4" font-size="10.4" font-weight="700" letter-spacing="1.4">CAMADA TÁTICA</text>
  <text x="174" y="92" fill="#E8EDF2" font-size="11.1" font-weight="600">o movimento do preço em k pregões</text>
  <text x="174" y="104" fill="#9BAEC0" font-size="10.4">peso somado por cima do BL</text>

  <path d="M390,84 L414,84" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>

  <rect x="420" y="60" width="230" height="48" rx="5" fill="#101F2E" stroke="#3D8FC4"/>
  <text x="434" y="77" fill="#3D8FC4" font-size="10.4" font-weight="700" letter-spacing="1.4">SPREAD SETORIAL</text>
  <text x="434" y="92" fill="#9BAEC0" font-size="10.4">sem exposição ao índice</text>
  <text x="434" y="104" fill="#E8EDF2" font-size="11.1" font-weight="600">→ dw = inv(δΣ)·μ</text>

  <!-- convergência: os dois tilts caem no mesmo teto -->
  <path d="M650,26 L684,44" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>
  <path d="M650,84 L684,66" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>

  <rect x="694" y="8" width="228" height="94" rx="5" fill="#16283A" stroke="#F5A623" stroke-width="1.4"/>
  <text x="710" y="28" fill="#F5A623" font-size="10.4" font-weight="700" letter-spacing="1.4">UM TETO PARA OS DOIS</text>
  <text x="710" y="52" fill="#E8EDF2" font-size="13.5" font-weight="700">Σ|w − w_mkt| ≤ 1</text>
  <text x="710" y="74" fill="#9BAEC0" font-size="10.4">corta as duas camadas juntas:</text>
  <text x="710" y="90" fill="#9BAEC0" font-size="10.4">entrar não é somar, é dividir.</text>

  <path d="M922,55 L942,55" stroke="#6B8299" stroke-width="1.3" fill="none" marker-end="url(#seta2)"/>

  <rect x="950" y="16" width="168" height="76" rx="5" fill="#101F2E" stroke="#24384B"/>
  <text x="964" y="40" fill="#F5A623" font-size="10" font-weight="700" letter-spacing="1.3">CARTEIRA DO DIA</text>
  <text x="964" y="60" fill="#9BAEC0" font-size="10.4">9 ETFs, peso irrestrito</text>
  <text x="964" y="78" fill="#9BAEC0" font-size="10.4">sem view ativa: só o equilíbrio</text>
</svg>
